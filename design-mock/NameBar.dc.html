<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap');
    body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif; }
  </style>
</helmet>
<div style="width: 390px; height: 620px; background: #ffffff; color: #101114; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 30px"></div>
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 20px 14px 20px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#101114" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
    <span style="font-family: 'Noto Serif KR', serif; font-weight: 600; font-size: 16px; color: #101114">일정 만들기</span>
    <span style="padding: 7px 14px; border: 1px solid #0164ff; border-radius: 4px; font-family: 'Noto Serif KR', serif; font-weight: 600; font-size: 13px; color: #0164ff">저장</span>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; margin: 0 20px 18px 20px; padding: 10px 12px; background: #e9f0ff; border-radius: 4px">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0150cd" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
    <span style="flex: 1; font-size: 12.5px; color: #062a63"><span style="font-weight: 600">온기가족</span>에 등록되는 일정이에요</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 22px; padding: 0 20px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 11px; letter-spacing: 1px; color: #0164ff">무슨 일정인가요?</span>
      <div style="display: flex; align-items: center; padding: 12px 14px; border: 1px solid rgba(16,17,20,0.14); border-radius: 4px">
        <span style="font-size: 14px; color: #b9bdc4">예: 아버님 생신</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 11px; letter-spacing: 1px; color: #0164ff">언제인가요?</span>
      <div style="display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 1px solid rgba(16,17,20,0.14); border-radius: 4px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7b8087" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M3 10h18"></path></svg>
        <span style="flex: 1; font-size: 14px; color: #101114">9. 7. (월)</span>
        <div style="display: flex; border: 1px solid rgba(16,17,20,0.14); border-radius: 4px; overflow: hidden">
          <span style="padding: 4px 10px; font-size: 12px; background: #0164ff; color: #ffffff">양력</span>
          <span style="padding: 4px 10px; font-size: 12px; color: #7b8087">음력</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 1px solid rgba(16,17,20,0.14); border-radius: 4px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7b8087" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span style="flex: 1; font-size: 14px; color: #101114">하루 종일</span>
        <div style="width: 44px; height: 26px; border-radius: 13px; background: #0164ff; display: flex; align-items: center; justify-content: flex-end; padding: 2px"><div style="width: 22px; height: 22px; border-radius: 11px; background: #ffffff"></div></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
