<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap');
    body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif; }
    a { color: #0164ff; } a:hover { color: #0150cd; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; color: #101114; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 54px"></div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 20px 14px 20px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#101114" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
    <span style="font-family: 'Noto Serif KR', serif; font-weight: 600; font-size: 16px; color: #101114">일정 만들기</span>
    <span style="padding: 7px 14px; border: 1px solid #0164ff; border-radius: 4px; font-family: 'Noto Serif KR', serif; font-weight: 600; font-size: 13px; color: #0164ff">저장</span>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 22px; padding: 8px 20px 0 20px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 11px; letter-spacing: 1px; color: #0164ff">무슨 일정인가요?</span>
      <div style="display: flex; align-items: center; padding: 12px 14px; border: 1px solid rgba(16,17,20,0.14); border-radius: 4px">
        <span style="font-size: 14px; color: #101114">아버님 생신</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 11px; letter-spacing: 1px; color: #0164ff">언제인가요?</span>

      <div style="display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 1px solid rgba(16,17,20,0.14); border-radius: 4px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7b8087" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M3 10h18"></path></svg>
        <span style="flex: 1; font-size: 14px; color: #101114; font-variant-numeric: tabular-nums">2026. 9. 12. (토)</span>
        <div style="display: flex; border: 1px solid rgba(16,17,20,0.14); border-radius: 4px; overflow: hidden">
          <span style="padding: 4px 10px; font-size: 12px; background: #0164ff; color: #ffffff">양력</span>
          <span style="padding: 4px 10px; font-size: 12px; color: #7b8087">음력</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 1px solid rgba(16,17,20,0.14); border-radius: 4px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7b8087" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span style="flex: 1; font-size: 14px; color: #101114">하루 종일</span>
        <div style="width: 44px; height: 26px; border-radius: 13px; background: #0164ff; display: flex; align-items: center; justify-content: flex-end; padding: 2px">
          <div style="width: 22px; height: 22px; border-radius: 11px; background: #ffffff"></div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 1px solid rgba(16,17,20,0.14); border-radius: 4px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7b8087" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9"></path><polyline points="21 3 21 9 15 9"></polyline></svg>
        <span style="flex: 1; font-size: 14px; color: #101114">반복</span>
        <span style="font-size: 13px; color: #0164ff">매년</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#b9bdc4" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 1px solid rgba(16,17,20,0.14); border-radius: 4px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7b8087" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
        <span style="flex: 1; font-size: 14px; color: #101114">알림 받을 사람</span>
        <span style="font-size: 13px; color: #0164ff">모두</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#b9bdc4" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 11px; letter-spacing: 1px; color: #0164ff">메모 <span style="color: rgba(16,17,20,0.55); letter-spacing: 0">(선택)</span></span>
      <div style="display: flex; align-items: flex-start; padding: 12px 14px; border: 1px solid rgba(16,17,20,0.14); border-radius: 4px; min-height: 72px">
        <span style="font-size: 14px; color: #b9bdc4">예: 저녁 7시까지 방배동 본가로 모여요</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: #f7f8fa; border-radius: 4px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7b8087" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      <span style="font-size: 12px; color: #5e6269">저장하면 바로 알림이 가고, 하루 전 오전 9시 · 시간이 있는 일정은 1시간 전에도 알려드려요</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
