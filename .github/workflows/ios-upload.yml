# TestFlight 업로드만 — 이미 빌드된 .ipa(다른 실행의 ongi-ios-ipa 아티팩트)를 App Store Connect API 키로 Apple 에 직접 올린다.
# EAS Submit 큐가 막혔을 때 우회용 (2026-09-30: EAS 무료 플랜 제출 큐에서 1시간 가까이 대기).
# 실행: gh workflow run ios-upload.yml -f run_id=<ios-testflight 실행 id>
# 필요한 시크릿: ASC_KEY_ID · ASC_ISSUER_ID · ASC_PRIVATE_KEY
name: iOS TestFlight Upload

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ongi-ios-ipa 아티팩트를 가진 iOS TestFlight 워크플로 실행 id'
        required: true

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'
    steps:
      - name: Download ipa artifact
        run: gh run download "${{ inputs.run_id }}" -R "${{ github.repository }}" -n ongi-ios-ipa -D . && ls -la ongi.ipa

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Upload to TestFlight
        run: |
          mkdir -p fastlane
          cat > fastlane/Fastfile <<'RUBY'
          default_platform(:ios)
          lane :upload do
            api_key = app_store_connect_api_key(
              key_id: ENV['ASC_KEY_ID'],
              issuer_id: ENV['ASC_ISSUER_ID'],
              key_content: ENV['ASC_PRIVATE_KEY'],
            )
            upload_to_testflight(
              api_key: api_key,
              app_identifier: 'com.ongifamily.app',
              ipa: './ongi.ipa',
              skip_submission: true,
              skip_waiting_for_build_processing: true,
            )
          end
          RUBY
          fastlane upload
