# iOS 빌드 → TestFlight 제출. EAS 클라우드 빌드 한도와 무관하게 GitHub macOS 러너에서 로컬 빌드한다.
# 실행: gh workflow run ios-testflight.yml  (또는 Actions 탭에서 Run workflow)
# 필요한 시크릿: EXPO_TOKEN (빌드·서명, https://expo.dev/accounts/ddoniel/settings/access-tokens) · ASC_KEY_ID · ASC_ISSUER_ID · ASC_PRIVATE_KEY (TestFlight 업로드)
name: iOS TestFlight

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build-and-submit:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Check EAS login
        run: eas whoami

      # Apple 은 최신 Xcode/iOS SDK 로 빌드한 앱만 받는다 (2026-09: Xcode 16.4 거부됨) — 러너 기본 Xcode 버전을 로그에 남긴다
      - name: Show Xcode version
        run: xcodebuild -version

      # 서명 인증서·프로비저닝은 EAS 서버에 저장된 것을 그대로 쓴다. 빌드 번호는 원격 자동 증가(autoIncrement)
      - name: Build (local, production)
        run: eas build --platform ios --profile production --local --non-interactive --output ./ongi.ipa

      - name: Upload ipa artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ongi-ios-ipa
          path: ./ongi.ipa
          if-no-files-found: ignore
          retention-days: 7

      # EAS Submit 은 무료 플랜 큐에서 오래 기다릴 수 있어(2026-09-30 1시간) App Store Connect API 키로 Apple 에 직접 올린다
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: |
          mkdir -p fastlane
          cat > fastlane/Fastfile <<'RUBY'
          default_platform(:ios)
          lane :upload do
            api_key = app_store_connect_api_key(
              key_id: ENV['ASC_KEY_ID'],
              issuer_id: ENV['ASC_ISSUER_ID'],
              key_content: ENV['ASC_PRIVATE_KEY'],
            )
            upload_to_testflight(
              api_key: api_key,
              app_identifier: 'com.ongifamily.app',
              ipa: './ongi.ipa',
              skip_submission: true,
              skip_waiting_for_build_processing: true,
            )
          end
          RUBY
          fastlane upload
