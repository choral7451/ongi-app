# App Store 심사 제출 — TestFlight 에 이미 올라간 빌드를 새 버전에 연결하고 "새로운 기능" 문구와 함께 제출한다.
# 실행: gh workflow run ios-release.yml -f version=1.0.8 -f notes="..." [-f build_number=61] [-f phased=true] [-f automatic_release=false]
# 필요한 시크릿: ASC_KEY_ID · ASC_ISSUER_ID · ASC_PRIVATE_KEY (App Store Connect API 키, App Manager)
name: iOS App Store Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '스토어 버전 (app.json version 과 같게, 예: 1.0.8)'
        required: true
      notes:
        description: '새로운 기능 (한국어 릴리즈 노트)'
        required: true
      build_number:
        description: '연결할 TestFlight 빌드 번호 (비우면 그 버전의 최신 빌드)'
        required: false
        default: ''
      automatic_release:
        description: '승인되면 자동으로 출시 (false 면 승인 후 수동 출시)'
        required: false
        default: 'true'
      phased:
        description: '7일 단계적 출시'
        required: false
        default: 'false'

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Write Fastfile
        run: |
          mkdir -p fastlane
          cat > fastlane/Fastfile <<'RUBY'
          default_platform(:ios)
          APP_ID = 'com.ongifamily.app'

          lane :release do |o|
            api_key = app_store_connect_api_key(
              key_id: ENV['ASC_KEY_ID'],
              issuer_id: ENV['ASC_ISSUER_ID'],
              key_content: ENV['ASC_PRIVATE_KEY'],
            )
            build_number = o[:build_number].to_s
            if build_number.empty?
              build_number = latest_testflight_build_number(api_key: api_key, app_identifier: APP_ID, version: o[:version]).to_s
            end
            UI.message("Submitting #{o[:version]} (#{build_number})")
            deliver(
              api_key: api_key,
              app_identifier: APP_ID,
              app_version: o[:version],
              build_number: build_number,
              skip_binary_upload: true,   # 바이너리는 TestFlight 워크플로가 이미 올렸다
              skip_screenshots: true,
              skip_metadata: false,
              release_notes: { 'ko' => o[:notes] },
              submit_for_review: true,
              automatic_release: o[:automatic_release],
              phased_release: o[:phased],
              run_precheck_before_submit: false,
              precheck_include_in_app_purchases: false,
              force: true,
              # 암호화 미사용(ITSAppUsesNonExemptEncryption=false) · IDFA 미사용
              submission_information: { add_id_info_uses_idfa: false, export_compliance_uses_encryption: false },
            )
          end
          RUBY

      - name: Submit for review
        run: |
          fastlane release \
            version:"${{ inputs.version }}" \
            notes:"${{ inputs.notes }}" \
            build_number:"${{ inputs.build_number }}" \
            automatic_release:${{ inputs.automatic_release }} \
            phased:${{ inputs.phased }}
